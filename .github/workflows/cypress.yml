name: Cypress Tests

on:
  pull_request:
    branches: [main]

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      - name: Run Node tests
        run: npm run test:unit

      # Chrome is selected by defaultBrowser in cypress.config.js.
      # ubuntu-latest already includes Google Chrome, so no install step is needed.
      - name: Run Cypress tests
        run: npm test
